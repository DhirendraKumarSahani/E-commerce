<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>
<body>

<h2>Verify OTP</h2>

<form method="POST">
    {% csrf_token %}

    <label>Enter OTP</label><br>
    <input type="text" name="otp" required><br><br>

    <button type="submit">Verify OTP</button>
</form>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

</body>
</html>
